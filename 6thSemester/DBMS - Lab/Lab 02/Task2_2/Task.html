<html>
<head>
    <title> Sign Up/Login Form </title>
</head>
<body>
    <!--This comment will not be displayed-->
    <div align = "center">
        <h1> Sign Up/Login Form </h1>
        <form action="">
            
        <input type="text" name="first name" placeholder="First Name" />
        <br /> <br />

        <input type="text" name="last name" placeholder="Last Name"/>
        <br /> <br />

        <input type="text" name="email" placeholder="Email"/>
        <br /> <br />
        
        <input type="password" name="password" placeholder="Enter new password"/>
        <br /> <br />
    
        <input type="confirm_password" name="confirm_password" placeholder="Confirm new password"/>
        <br /> <br />

        Male:
        <input type="radio" name="sex" value="male" checked />
        Female:
        <input type="radio" name="sex" value="female" />
        <br /> <br />

        Do you want to recieve News from us?:
        <input type="checkbox" name="news" value="bike" checked /> <br />
        I accept the terms and conditions:
        <input type="checkbox" name="vehicle" value="car" />
        <br /> <br />        
        <br /><br />
        <input type="button" value="Sign Up" /> <br /> <br />
        <input type="button" value="Sign In Instead" />
        <br /> <br />
    </form>
    </div>
</body>
</html>
